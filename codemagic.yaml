workflows:
  maui-android:
    name: MijuegoApk Android
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Instalar .NET y MAUI
        script: |
          dotnet workload install maui-android
      - name: Restaurar y Compilar APK
        script: |
          dotnet restore MijuegoApk.csproj
          dotnet publish MijuegoApk.csproj -f net8.0-android -c Release -o ./build
    artifacts:
      - build/*.apk
      - build/*.aab
    publishing:
      email:
        recipients:
          - theslayermods8110@gmail.com
