workflows:
  unity-android:
    name: Free Fire Clone Android
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      xcode: latest
      unity: 2022.3.20f1
      groups:
        - unity
    scripts:
      - name: Activar licencia Unity
        script: |
          unity -batchmode -quit -logFile -createManualActivationFile || true
      - name: Compilar APK Unity
        script: |
          unity -batchmode -quit -logFile build.log -projectPath . -buildTarget Android -executeMethod BuildScript.BuildAndroid -nographics
    artifacts:
      - build/*.apk
      - build/*.aab
