      - name: Activar licencia Unity
        script: |
          $UNITY_HOME/Contents/MacOS/Unity -batchmode -quit -logFile -serial $UNITY_SERIAL -username $UNITY_EMAIL -password $UNITY_PASSWORD -nographics || true
      - name: Compilar APK Unity
        script: |
          $UNITY_HOME/Contents/MacOS/Unity -batchmode -quit -logFile build.log -projectPath . -buildTarget Android -executeMethod BuildScript.BuildAndroid -nographics
