name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Install MAUI
        run: dotnet workload install maui-android
      - name: Restore
        run: dotnet restore ExploradorV2/ExploradorV2.csproj
      - name: Build APK
        run: dotnet publish ExploradorV2/ExploradorV2.csproj -c Release -f net9.0-android -p:AndroidPackageFormat=apk -o output
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: output/*.apk
